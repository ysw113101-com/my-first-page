<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>숫자 카운터 웹앱</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* 숫자가 바뀔 때 톡 튀어오르는 애니메이션 효과 */
        .number-transition {
            transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .pop {
            transform: scale(1.15);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-indigo-50 via-slate-50 to-blue-100 min-h-screen flex flex-col justify-center items-center text-slate-800 p-4">

    <!-- 메인 컨테이너 카드 -->
    <main class="w-full max-w-md bg-white/90 backdrop-blur-md rounded-3xl shadow-2xl border border-white p-8 flex flex-col items-center">
        
        <!-- 타이틀 섹션 -->
        <div class="text-center mb-8">
            <span class="inline-block px-3 py-1 bg-indigo-100 text-indigo-700 text-xs font-bold rounded-full mb-2">Interactive App</span>
            <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight">
                실시간 숫자 카운터
            </h1>
            <p class="text-sm text-slate-500 mt-1">버튼을 클릭하여 숫자를 늘리거나 줄여보세요</p>
        </div>

        <!-- 카운터 디스플레이 박스 -->
        <div class="w-full bg-slate-50 border border-slate-200/80 rounded-2xl py-10 px-6 flex flex-col items-center justify-center mb-8 shadow-inner relative overflow-hidden">
            <div class="absolute inset-0 bg-indigo-500/5 pointer-events-none"></div>
            <span id="counterValue" class="text-7xl font-extrabold text-indigo-600 number-transition select-none">0</span>
            <span class="text-xs uppercase tracking-widest text-slate-400 font-semibold mt-3">현재 카운트</span>
        </div>

        <!-- 컨트롤 버튼 그룹 -->
        <div class="grid grid-cols-2 gap-4 w-full mb-4">
            <button id="decreaseBtn" 
                class="flex items-center justify-center py-4 px-6 bg-slate-100 hover:bg-slate-200 active:scale-95 text-slate-700 font-bold rounded-2xl transition shadow-sm cursor-pointer select-none">
                <svg class="w-5 h-5 mr-1" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M20 12H4"></path></svg>
                감소 (-1)
            </button>
            <button id="increaseBtn" 
                class="flex items-center justify-center py-4 px-6 bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white font-bold rounded-2xl transition shadow-lg shadow-indigo-500/30 cursor-pointer select-none">
                <svg class="w-5 h-5 mr-1" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"></path></svg>
                증가 (+1)
            </button>
        </div>

        <!-- 초기화 버튼 -->
        <button id="resetBtn" 
            class="w-full py-3 px-4 bg-transparent hover:bg-rose-50 text-rose-500 hover:text-rose-600 font-semibold rounded-2xl transition border border-rose-200 hover:border-rose-300 active:scale-98 cursor-pointer select-none text-sm flex items-center justify-center">
            <svg class="w-4 h-4 mr-1.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
            초기화 (Reset)
        </button>

    </main>

    <!-- 푸터 -->
    <footer class="mt-8 text-xs text-slate-400 font-medium text-center">
        Single-File HTML Web Application
    </footer>

    <!-- 자바스크립트 로직 -->
    <script>
        const counterValueEl = document.getElementById('counterValue');
        const increaseBtn = document.getElementById('increaseBtn');
        const decreaseBtn = document.getElementById('decreaseBtn');
        const resetBtn = document.getElementById('resetBtn');

        let count = 0;

        function updateDisplay() {
            counterValueEl.textContent = count;

            // 값에 따른 글자 색상 변경 처리
            if (count > 0) {
                counterValueEl.className = "text-7xl font-extrabold text-indigo-600 number-transition select-none";
            } else if (count < 0) {
                counterValueEl.className = "text-7xl font-extrabold text-rose-500 number-transition select-none";
            } else {
                counterValueEl.className = "text-7xl font-extrabold text-slate-700 number-transition select-none";
            }

            // 팝 애니메이션 적용
            counterValueEl.classList.add('pop');
            setTimeout(() => {
                counterValueEl.classList.remove('pop');
            }, 150);
        }

        // 버튼 클릭 이벤트 리스너
        increaseBtn.addEventListener('click', () => {
            count++;
            updateDisplay();
        });

        decreaseBtn.addEventListener('click', () => {
            count--;
            updateDisplay();
        });

        resetBtn.addEventListener('click', () => {
            if (count !== 0) {
                count = 0;
                updateDisplay();
            }
        });

        // 키보드 키 연동 (위 방향키: 증가, 아래 방향키: 감소, R: 초기화)
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowUp' || e.key === '+') {
                count++;
                updateDisplay();
            } else if (e.key === 'ArrowDown' || e.key === '-') {
                count--;
                updateDisplay();
            } else if (e.key === 'r' || e.key === 'R') {
                count = 0;
                updateDisplay();
            }
        });
    </script>
</body>
</html>
