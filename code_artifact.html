<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>인터랙티브 카운터</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* 숫자가 바뀔 때 부드러운 애니메이션 효과 */
        .number-transition {
            transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.15s ease;
        }
        .pop {
            transform: scale(1.15);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-indigo-50 via-white to-sky-50 min-h-screen flex flex-col justify-center items-center text-slate-800">

    <main class="w-full max-w-md mx-4 p-8 bg-white/80 backdrop-blur-xl rounded-3xl shadow-2xl border border-white/50 flex flex-col items-center">
        
        <!-- 헤더 타이틀 -->
        <div class="text-center mb-8">
            <h1 class="text-2xl font-extrabold tracking-tight bg-gradient-to-r from-indigo-600 to-violet-600 bg-clip-text text-transparent">
                스마트 카운터
            </h1>
            <p class="text-sm text-slate-500 mt-1">버튼을 눌러 숫자를 조절해 보세요</p>
        </div>

        <!-- 현재 숫자 디스플레이 -->
        <div class="w-full bg-slate-50 border border-slate-100 rounded-2xl py-12 px-6 flex flex-col items-center justify-center mb-8 shadow-inner relative overflow-hidden">
            <div class="absolute inset-0 bg-indigo-500/5 pointer-events-none"></div>
            <span id="counterValue" class="text-7xl font-extrabold text-indigo-600 number-transition select-none">0</span>
            <span class="text-xs uppercase tracking-widest text-slate-400 font-semibold mt-3">Current Count</span>
        </div>

        <!-- 컨트롤 버튼 영역 -->
        <div class="grid grid-cols-2 gap-4 w-full mb-4">
            <button id="decreaseBtn" 
                class="flex items-center justify-center py-4 px-6 bg-slate-100 hover:bg-slate-200 active:scale-95 text-slate-700 font-bold rounded-2xl transition shadow-sm cursor-pointer select-none">
                <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M20 12H4"></path></svg>
                감소 (-1)
            </button>
            <button id="increaseBtn" 
                class="flex items-center justify-center py-4 px-6 bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white font-bold rounded-2xl transition shadow-lg shadow-indigo-500/30 cursor-pointer select-none">
                <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"></path></svg>
                증가 (+1)
            </button>
        </div>

        <!-- 리셋 버튼 -->
        <button id="resetBtn" 
            class="w-full py-3 px-4 bg-transparent hover:bg-rose-50 text-rose-500 hover:text-rose-600 font-semibold rounded-2xl transition border border-rose-200 hover:border-rose-300 active:scale-98 cursor-pointer select-none text-sm flex items-center justify-center">
            <svg class="w-4 h-4 mr-1.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
            초기화 (Reset)
        </button>

    </main>

    <!-- 푸터 -->
    <footer class="mt-8 text-xs text-slate-400 font-medium">
        Interactive Web Application &copy; 2026
    </footer>

    <script>
        // DOM 요소 참조
        const counterValueEl = document.getElementById('counterValue');
        const increaseBtn = document.getElementById('increaseBtn');
        const decreaseBtn = document.getElementById('decreaseBtn');
        const resetBtn = document.getElementById('resetBtn');

        // 카운터 상태 변수
        let count = 0;

        // UI 업데이트 및 애니메이션 효과 함수
        function updateDisplay(withAnimation = true) {
            counterValueEl.textContent = count;

            // 색상 동적 변경 (음수일 때 빨간색, 양수일 때 인디고, 0일 때 기본)
            if (count > 0) {
                counterValueEl.className = "text-7xl font-extrabold text-indigo-600 number-transition select-none";
            } else if (count < 0) {
                counterValueEl.className = "text-7xl font-extrabold text-rose-500 number-transition select-none";
            } else {
                counterValueEl.className = "text-7xl font-extrabold text-slate-700 number-transition select-none";
            }

            if (withAnimation) {
                counterValueEl.classList.add('pop');
                setTimeout(() => {
                    counterValueEl.classList.remove('pop');
                }, 150);
            }
        }

        // 이벤트 리스너 등록 (클래식 및 터치 최적화)
        increaseBtn.addEventListener('click', () => {
            count++;
            updateDisplay();
        });

        decreaseBtn.addEventListener('click', () => {
            count--;
            updateDisplay();
        });

        resetBtn.addEventListener('click', () => {
            if (count !== 0) {
                count = 0;
                updateDisplay();
            }
        });

        // 키보드 접근성 지원 (상/하 화살표 키로도 조작 가능)
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowUp' || e.key === '+') {
                count++;
                updateDisplay();
            } else if (e.key === 'ArrowDown' || e.key === '-') {
                count--;
                updateDisplay();
            } else if (e.key === 'r' || e.key === 'R') {
                count = 0;
                updateDisplay();
            }
        });
    </script>
</body>
</html>
